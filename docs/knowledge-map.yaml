# Knowledge map (our own convention, not a Claude Code feature). Routes a ticket component
# to the small set of code and docs that matter. Owned by the architect; changes go through a PR.
# Format rules (pr-guard parses this with a tiny reader): top-level key = component, list fields in [a, b] flow style.
# risk: low | medium | high | blocked  (see docs/autonomy-by-risk.md)
# STATUS: current. pr-guard fails any glob that matches no file, so an entry is added together with the code it describes.
# Tickets also list the shared files they touch (Program.cs, Persistence/**, shared/**) in their own allowed_paths.

harness:
  components: [Harness, CI]
  code_paths: [.github/**, .claude/**, scripts/**]
  docs: [docs/autonomy-by-risk.md, docs/ticket-workflow.md]
  protected_paths: [.github/**, .claude/**, scripts/**, CLAUDE.md, REPO_CONTEXT.md, docs/knowledge-map.yaml]
  owners: [shivansh-gupta-ness]
  risk: blocked

backend-platform:
  components: [Backend Platform]
  code_paths: [src/backend/**]
  docs: [docs/adr/ADR-001-solution-layering.md, docs/adr/ADR-002-ef-core-sqlite.md, docs/adr/ADR-003-api-conventions.md, docs/adr/ADR-005-testing-coverage-and-ac-log.md, docs/specs/data-model.md]
  protected_paths: []
  owners: [shivansh-gupta-ness]
  risk: low

frontend-platform:
  components: [Frontend Platform]
  code_paths: [src/frontend/**]
  docs: [docs/adr/ADR-006-angular-structure.md, docs/adr/ADR-005-testing-coverage-and-ac-log.md, docs/specs/ui.md]
  protected_paths: []
  owners: [shivansh-gupta-ness]
  risk: low

api-contracts:
  components: [API Contracts]
  code_paths: [docs/specs/api/**]
  docs: [docs/adr/ADR-003-api-conventions.md, docs/specs/product.md]
  protected_paths: []
  owners: [shivansh-gupta-ness]
  risk: low

locations:
  components: [Locations]
  code_paths: [src/backend/**/Locations/**, src/frontend/src/app/features/locations/**]
  docs: [docs/specs/product.md, docs/specs/data-model.md, docs/specs/ui.md, docs/specs/api/locations.yaml, docs/adr/ADR-001-solution-layering.md, docs/adr/ADR-003-api-conventions.md]
  protected_paths: []
  owners: [shivansh-gupta-ness]
  risk: low

# Products is design only plus the TASK-005 entity and schema; no use cases, endpoints or screens (scope decision 2026-11-19).
products:
  components: [Products]
  code_paths: [src/backend/**/Products/**, src/frontend/src/app/features/products/**]
  docs: [docs/specs/product.md, docs/specs/data-model.md, docs/specs/ui.md, docs/specs/api/products.yaml, docs/adr/ADR-001-solution-layering.md, docs/adr/ADR-003-api-conventions.md]
  protected_paths: []
  owners: [shivansh-gupta-ness]
  risk: low

# Not built in this evaluation (scope decision 2026-11-19); add an entry when a module is built, one per component:
# inventory:   code_paths [src/backend/**/Inventory/**, src/frontend/**/inventory/**]            risk: medium
# inbound:     receiving / put-away                                                                risk: medium
# outbound:    orders, picking, shipping                                                           risk: medium
# auth:        authentication and roles                                                            risk: high
