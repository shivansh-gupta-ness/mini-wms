openapi: 3.0.3
info:
  title: Rule test - operation without x-acceptance-criteria
  version: 1.0.0
  description: The only operation has no x-acceptance-criteria, so rule operation-has-acceptance-criteria must fire.
servers:
  - url: http://localhost:5080/api/v1
tags:
  - { name: Things, description: Test things }
paths:
  /things/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      operationId: getThing
      summary: Get a thing
      description: Single-object read without acceptance criteria.
      tags: [Things]
      responses:
        '200':
          description: The thing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Thing' }
components:
  schemas:
    Thing:
      type: object
      properties:
        id: { type: integer }
