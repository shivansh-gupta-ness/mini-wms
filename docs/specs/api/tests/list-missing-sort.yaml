openapi: 3.0.3
info:
  title: Rule test - list operation without sort
  version: 1.0.0
  description: The list operation has page and pageSize but no sort, so rule list-operation-has-paging-params must fire.
servers:
  - url: http://localhost:5080/api/v1
tags:
  - { name: Things, description: Test things }
paths:
  /things:
    get:
      operationId: listThings
      summary: List things
      description: A list operation that forgot the sort parameter.
      tags: [Things]
      x-acceptance-criteria: [TST-1.1]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
      responses:
        '200':
          description: A page of things
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThingPage' }
components:
  schemas:
    Thing:
      type: object
      properties:
        id: { type: integer }
    ThingPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Thing' } }
        page: { type: integer }
