openapi: 3.0.3
info:
  title: Mini WMS API - Locations
  version: 1.0.0
  description: >
    Contract for module LOC (docs/specs/product.md). Conventions: docs/adr/ADR-003-api-conventions.md.
    The x-acceptance-criteria extension lists the ACs each operation serves.
servers:
  - url: http://localhost:5080/api/v1
tags:
  - { name: Warehouse, description: The single warehouse }
  - { name: Zones, description: Zones inside the warehouse }
  - { name: Bins, description: Bins inside zones }
  - { name: Locations, description: Combined views over zones and bins }
paths:
  /warehouse:
    description: The warehouse can be read and renamed, never created or deleted. POST and DELETE return 405 with the header Allow GET, PATCH.
    get:
      operationId: getWarehouse
      summary: Get the single warehouse
      tags: [Warehouse]
      description: Returns the one warehouse that exists; no endpoint can create a second one. Returns 404 if the warehouse row is missing.
      x-acceptance-criteria: [LOC-1.1, LOC-3.1]
      responses:
        '200': { description: The warehouse, content: { application/json: { schema: { $ref: '#/components/schemas/Warehouse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: renameWarehouse
      summary: Change the warehouse name (Admin)
      tags: [Warehouse]
      description: Renames the warehouse; the code stays unchanged. Returns 404 if the warehouse row is missing. A stale version returns 409.
      x-acceptance-criteria: [LOC-2.1]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RenameRequest' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Warehouse' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /zones:
    get:
      operationId: listZones
      summary: List zones (paged, sortable, searchable)
      tags: [Zones]
      description: Returns a page of zones, optionally filtered by type, active state or a search text on code or name. Allowed sort fields are code, name, type and isActive (prefix with - for descending). binCount counts all bins of the zone, including inactive ones.
      x-acceptance-criteria: [LOC-3.1, LOC-3.2]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/Sort' }
        - { $ref: '#/components/parameters/Q' }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/ZoneType' } }
        - { name: isActive, in: query, schema: { type: boolean } }
      responses:
        '200': { description: A page of zones, content: { application/json: { schema: { $ref: '#/components/schemas/ZonePage' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
    post:
      operationId: createZone
      summary: Create a zone (Admin)
      tags: [Zones]
      description: Creates an Active zone. Missing or invalid fields return 400. A code already used in the warehouse, compared without regard to case, also returns 400 with the message under errors.code.
      x-acceptance-criteria: [LOC-1.2, LOC-1.4]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateZoneRequest' } } }
      responses:
        '201': { description: Created, headers: { Location: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Zone' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
  /zones/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      operationId: getZone
      summary: Get a zone
      tags: [Zones]
      description: Returns one zone by id, or 404 when it does not exist.
      x-acceptance-criteria: [LOC-3.1]
      responses:
        '200': { description: The zone, content: { application/json: { schema: { $ref: '#/components/schemas/Zone' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateZone
      summary: Change a zone's name (Admin); type may change only while the zone has no bins
      tags: [Zones]
      description: Updates the name, and the type while the zone has no bins. The code never changes. A stale version returns 409.
      x-acceptance-criteria: [LOC-2.1]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateZoneRequest' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Zone' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /zones/{id}/deactivate:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      operationId: deactivateZone
      summary: Deactivate a zone with no Active bin (Admin)
      tags: [Zones]
      description: Marks the zone Inactive. A missing or invalid version in the body returns 400. A zone that still has an Active bin, or a stale version, returns 409. Deactivating a zone that is already Inactive returns 200 and changes nothing.
      x-acceptance-criteria: [LOC-2.4]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VersionRequest' } } }
      responses:
        '200': { description: Deactivated, content: { application/json: { schema: { $ref: '#/components/schemas/Zone' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /bins:
    get:
      operationId: listBins
      summary: List bins (paged, sortable, searchable)
      tags: [Bins]
      description: Returns a page of bins, optionally filtered by zone, active state or a search text on code or name. Allowed sort fields are code, name, zone (the zone code) and isActive (prefix with - for descending).
      x-acceptance-criteria: [LOC-3.1, LOC-3.2]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/Sort' }
        - { $ref: '#/components/parameters/Q' }
        - { name: zoneId, in: query, schema: { type: integer, format: int32 } }
        - { name: isActive, in: query, schema: { type: boolean } }
      responses:
        '200': { description: A page of bins, content: { application/json: { schema: { $ref: '#/components/schemas/BinPage' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
    post:
      operationId: createBin
      summary: Create a bin in a zone (Admin)
      tags: [Bins]
      description: Creates an Active bin under a zone. Missing or invalid fields return 400. A code already used in the warehouse, compared without regard to case, returns 400 with the message under errors.code. An unknown or Inactive zone returns 400 with the message under errors.zoneId.
      x-acceptance-criteria: [LOC-1.3, LOC-1.4]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateBinRequest' } } }
      responses:
        '201': { description: Created, headers: { Location: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Bin' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
  /bins/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      operationId: getBin
      summary: Get a bin
      tags: [Bins]
      description: Returns one bin by id, including its display path, or 404 when it does not exist.
      x-acceptance-criteria: [LOC-3.1]
      responses:
        '200': { description: The bin, content: { application/json: { schema: { $ref: '#/components/schemas/Bin' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateBin
      summary: Change a bin's name (Admin)
      tags: [Bins]
      description: Renames the bin; the code stays unchanged. A stale version returns 409.
      x-acceptance-criteria: [LOC-2.1]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RenameRequest' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Bin' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /bins/{id}/deactivate:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      operationId: deactivateBin
      summary: Deactivate a bin that holds no stock (Admin)
      tags: [Bins]
      description: Marks the bin Inactive. A missing or invalid version in the body returns 400. A bin that holds stock, or a stale version, returns 409 with a message naming the stock on hand. Deactivating a bin that is already Inactive returns 200 and changes nothing.
      x-acceptance-criteria: [LOC-2.2, LOC-2.3]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VersionRequest' } } }
      responses:
        '200': { description: Deactivated, content: { application/json: { schema: { $ref: '#/components/schemas/Bin' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /locations/tree:
    get:
      operationId: getLocationTree
      summary: Zones with their bins, for the tree view
      tags: [Locations]
      description: Returns every zone with its bins nested, unpaged, for the tree view. The optional isActive filter applies to zones and to bins independently.
      x-acceptance-criteria: [LOC-3.1]
      parameters:
        - { name: isActive, in: query, schema: { type: boolean } }
      responses:
        '200': { description: The tree, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ZoneNode' } } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
components:
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer, format: int32 } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
    Sort: { name: sort, in: query, description: "One field name, prefix with - for descending (for example -code). Allowed fields: zones are code, name, type, isActive; bins are code, name, zone, isActive.", schema: { type: string } }
    Q: { name: q, in: query, description: "Part of the code or name, at most 100 characters. Case is ignored for ASCII letters only.", schema: { type: string, maxLength: 100 } }
  responses:
    ValidationError: { description: Request failed validation, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    NotFound: { description: Resource not found, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Conflict: { description: Business-rule conflict or stale version, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  schemas:
    ZoneType: { type: string, enum: [Receiving, Storage, Shipping] }
    Warehouse:
      type: object
      required: [id, code, name, isActive, version]
      properties:
        id: { type: integer, format: int32 }
        code: { type: string }
        name: { type: string, maxLength: 100 }
        isActive: { type: boolean }
        version: { type: integer }
    Zone:
      type: object
      required: [id, warehouseId, code, name, type, isActive, binCount, version]
      properties:
        id: { type: integer, format: int32 }
        warehouseId: { type: integer, format: int32 }
        code: { type: string, maxLength: 20 }
        name: { type: string, maxLength: 100 }
        type: { $ref: '#/components/schemas/ZoneType' }
        isActive: { type: boolean }
        binCount: { type: integer }
        version: { type: integer }
    Bin:
      type: object
      required: [id, zoneId, zoneCode, code, name, path, isActive, version]
      properties:
        id: { type: integer, format: int32 }
        zoneId: { type: integer, format: int32 }
        zoneCode: { type: string }
        code: { type: string, maxLength: 30 }
        name: { type: string, maxLength: 100 }
        path: { type: string, description: "zone / bin, for display" }
        isActive: { type: boolean }
        version: { type: integer }
    ZoneNode:
      allOf:
        - { $ref: '#/components/schemas/Zone' }
        - type: object
          required: [bins]
          properties: { bins: { type: array, items: { $ref: '#/components/schemas/Bin' } } }
    CreateZoneRequest:
      type: object
      required: [code, name, type]
      properties:
        code: { type: string, maxLength: 20 }
        name: { type: string, maxLength: 100 }
        type: { $ref: '#/components/schemas/ZoneType' }
    UpdateZoneRequest:
      type: object
      required: [name, version]
      properties:
        name: { type: string, maxLength: 100 }
        type: { $ref: '#/components/schemas/ZoneType' }
        version: { type: integer }
    CreateBinRequest:
      type: object
      required: [zoneId, code, name]
      properties:
        zoneId: { type: integer, format: int32 }
        code: { type: string, maxLength: 30 }
        name: { type: string, maxLength: 100 }
    RenameRequest:
      type: object
      required: [name, version]
      properties:
        name: { type: string, maxLength: 100 }
        version: { type: integer }
    VersionRequest:
      type: object
      required: [version]
      properties: { version: { type: integer } }
    ZonePage:
      type: object
      required: [items, page, pageSize, totalItems]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Zone' } }
        page: { type: integer }
        pageSize: { type: integer }
        totalItems: { type: integer }
    BinPage:
      type: object
      required: [items, page, pageSize, totalItems]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Bin' } }
        page: { type: integer }
        pageSize: { type: integer }
        totalItems: { type: integer }
    Problem:
      type: object
      required: [type, title, status, traceId]
      properties:
        type: { type: string, description: "validation, conflict, not-found, unauthorized, forbidden, error" }
        title: { type: string }
        status: { type: integer }
        traceId: { type: string, description: "Correlation id of the request, also written to the log" }
        detail: { type: string, description: "Present only on 4xx responses, and only when the text was written by our own code (validation and business-rule messages). Never sent on a 5xx and never raw exception text." }
        errors: { type: object, additionalProperties: { type: array, items: { type: string } } }
